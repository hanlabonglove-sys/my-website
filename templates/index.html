<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Website</title>

    <style>
        body {
            margin: 0;
            background: #111827;
            color: white;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            text-align: center;
        }

        .box {
            background: #1f2937;
            padding: 50px;
            border-radius: 20px;
            box-shadow: 0 20px 50px #0008;
        }

        h1 {
            font-size: 45px;
            margin-bottom: 10px;
        }

        p {
            color: #9ca3af;
        }

        button {
            margin-top: 20px;
            padding: 12px 25px;
            border: 0;
            border-radius: 10px;
            background: #3b82f6;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }
    </style>
</head>

<body>

<div class="box">
    <h1>🚀 와 우</h1>
    <p>서버가 정상적으로 작동 중입니다.</p>

    <button onclick="location.href='/hello'">
        테스트
    </button>
</div>

</body>
</html>
